  *{box-sizing:border-box;margin:0;padding:0}

  body{
    min-height:100vh;
    background:#111311;
    color:#aab5aa;
    font-family:"IntroSans","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:28px 18px 40px;gap:20px;
  }

  .head{text-align:center}
  .head h1{font-size:14px;font-weight:900;letter-spacing:.22em;text-indent:.22em;color:#dfe7df}
  .head p{margin-top:9px;font-size:10px;letter-spacing:.14em;color:#5c675c}

  .card{display:inline-grid;gap:12px}

  .stage{
    position:relative;
    height:min(76vh,760px);
    aspect-ratio:9/16;
    background:#f6f6f0;
    overflow:hidden;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.9), 0 0 0 1px #242924;
    cursor:pointer;
  }
  .stage svg{
    position:absolute;inset:0;
    width:100%;height:100%;
    display:none;
  }
  .stage svg.on{display:block}
  .stage svg.loop{display:none}
  .stage svg.loop.on{display:block}

  .sw{transform-box:view-box;transform-origin:100px 1040px}
  .k1{animation:swA 1.03s ease-in-out infinite}
  .k2{animation:swB 1.13s ease-in-out infinite;animation-delay:-.18s}
  .k3{animation:swC 1.23s ease-in-out infinite;animation-delay:-.36s}
  @keyframes swA{0%,100%{transform:rotate(-1.7deg)}50%{transform:rotate(1.7deg)}}
  @keyframes swB{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
  @keyframes swC{0%,100%{transform:rotate(-1.1deg)}50%{transform:rotate(1.1deg)}}

  .dotP{transform-box:view-box;transform-origin:980px 880px;
        animation:dotP 1s ease-in-out infinite}
  @keyframes dotP{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

  .brth{transform-box:view-box;transform-origin:540px 1302px;
        animation:brth 1s ease-in-out infinite}
  @keyframes brth{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}

  .rip{transform-box:view-box;transform-origin:540px 1302px;
       animation:rip .9s linear infinite}
  .r2{animation-delay:-.45s}
  @keyframes rip{0%{transform:scale(1);opacity:.42}100%{transform:scale(1.18);opacity:0}}

  .sp1{transform-box:view-box;transform-origin:920px 190px;
       animation:spinA 9s linear infinite}
  .sp2{transform-box:view-box;transform-origin:162px 630px;
       animation:spinB 11s linear infinite}
  @keyframes spinA{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @keyframes spinB{from{transform:rotate(0)}to{transform:rotate(-360deg)}}

  /* 参与动态轮换 */
  .pr{transform-box:fill-box;transform-origin:center;opacity:0}
  .pr.on{opacity:1}
  .pr.up{animation:pUp .26s cubic-bezier(.4,0,.8,1) forwards}
  .pr.in{animation:pIn .3s .05s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes pUp{0%{transform:translateY(0);opacity:1}
                 100%{transform:translateY(-18px);opacity:0}}
  @keyframes pIn{0%{transform:translateY(18px);opacity:0}
                 100%{transform:translateY(0);opacity:1}}

  .hud{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:12px}

  button{
    font:inherit;font-size:11px;font-weight:700;letter-spacing:.14em;
    color:#b9c6b9;background:transparent;
    border:1px solid #333b33;border-radius:2px;
    padding:8px 12px;cursor:pointer;
    transition:border-color .15s,color .15s;
  }
  button:hover{border-color:#6d8a72;color:#e8f0e6}

  .track{position:relative;height:2px;background:#2b322c;overflow:hidden;border-radius:2px}
  .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#476b50;border-radius:2px}

  .count{
    font-size:10px;letter-spacing:.12em;color:#6f7d70;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }

  .toast{
    position:fixed;left:50%;bottom:36px;transform:translate(-50%,20px);
    background:#476b50;color:#f6f6f0;font-size:12px;letter-spacing:.12em;
    padding:12px 22px;border-radius:2px;opacity:0;pointer-events:none;
    transition:opacity .25s,transform .25s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  body.grid .card{width:min(1080px,94vw)}
  body.grid .stage{
    height:auto;aspect-ratio:auto;
    display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
    align-items:start;justify-items:stretch;
    gap:5px;overflow:visible;background:transparent;box-shadow:none;cursor:auto;
  }
  body.grid .stage svg{
    position:relative;inset:auto;
    width:100%;height:auto;
    aspect-ratio:1080/1920;
    align-self:start;
    display:block;
    background:#f6f6f0;
  }
</style>
</head>

  <div class="hud">
    <button id="play" type="button">播放</button>
    <div class="track"><div class="fill" id="fill"></div></div>
    <span class="count" id="count">180 / 180</span>
    <button id="view" type="button">全部帧</button>
  </div>
</div>

<div class="toast" id="toast">正在进入答题 …</div>

<script>
(function(){
  var stage   = document.getElementById('stage');
  var frames  = Array.prototype.slice.call(stage.querySelectorAll('svg:not(.loop)'));
  var loopEl  = document.getElementById('intro-loop');
  var playBtn = document.getElementById('play');
  var viewBtn = document.getElementById('view');
  var fillEl  = document.getElementById('fill');
  var countEl = document.getElementById('count');
  var toast   = document.getElementById('toast');

  var N        = frames.length;
  var FRAME_MS = 1000 / 60;

  var cur = -1, playing = false, timer = null, t0 = 0, inLoop = false;

  function pad(n){
    var s = '' + n, w = ('' + N).length;
    while (s.length < w) s = '0' + s;
    return s;
  }

  function setFrame(i){
    if (i === cur && !inLoop) return;
    if (inLoop) { loopEl.classList.remove('on'); inLoop = false; }
    if (cur >= 0 && frames[cur]) frames[cur].classList.remove('on');
    cur = i;
    frames[i].classList.add('on');
    fillEl.style.width = ((i + 1) / N * 100) + '%';
    countEl.textContent = '入场 ' + pad(i + 1) + ' / ' + pad(N);
  }

  function showLoop(){
    if (inLoop) return;
    if (cur >= 0 && frames[cur]) frames[cur].classList.remove('on');
    cur = -1;
    loopEl.classList.add('on');
    inLoop = true;
    fillEl.style.width = '100%';
    countEl.textContent = '循环中 · 点击进入';
  }

  function tick(){
    if (!playing) return;
    var t = performance.now() - t0;
    var e = N * FRAME_MS;
    if (t < e) {
      var i = Math.floor(t / FRAME_MS);
      if (i > N - 1) i = N - 1;
      setFrame(i);
    } else {
      showLoop();
    }
  }

  function stop(){
    playing = false;
    playBtn.textContent = '播放';
    if (timer) { clearInterval(timer); timer = null; }
  }

  function start(){
    playing = true;
    playBtn.textContent = '暂停';
    if (inLoop) { loopEl.classList.remove('on'); inLoop = false; }
    setFrame(0);
    t0 = performance.now();
    tick();
    timer = setInterval(tick, 8);
  }

  playBtn.addEventListener('click', function(){
    if (playing) { stop(); return; }
    start();
  });

  stage.addEventListener('click', function(e){
    if (document.body.classList.contains('grid')) return;
    if (e.target.closest('button')) return;
    if (!inLoop) return;
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toast.classList.remove('show'); }, 1600);
  });

  viewBtn.addEventListener('click', function(){
    stop();
    document.body.classList.toggle('grid');
    viewBtn.textContent = document.body.classList.contains('grid') ? '播放视图' : '全部帧';
  });

  window.addEventListener('keydown', function(e){
    if (document.body.classList.contains('grid')) return;
    if (e.key === 'ArrowRight'){ stop(); setFrame(Math.min(cur + 1, N - 1)); e.preventDefault(); }
    if (e.key === 'ArrowLeft'){  stop(); setFrame(Math.max(cur - 1, 0)); e.preventDefault(); }
    if (e.key === ' '){ playBtn.click(); e.preventDefault(); }
  });

  setFrame(N - 1);

  // 参与动态：真人名字轮换
  var NAMES = ["李思远","王雨桐","陈嘉禾","周子涵","林语晨","赵明轩","郑可欣","孙一诺"];
  var pA = document.getElementById('pA');
  var pB = document.getElementById('pB');
  if (pA && pB) {
    var nameEls = [pA.querySelector('text'), pB.querySelector('text')];
    var useA = true, ni = 0;
    setInterval(function(){
      ni = (ni + 1) % NAMES.length;
      var curEl = useA ? pA : pB;
      var nxtEl = useA ? pB : pA;
      var nxtName = useA ? nameEls[1] : nameEls[0];
      nxtName.textContent = NAMES[ni];
      curEl.classList.remove('on');
      nxtEl.classList.remove('up', 'in');
      void nxtEl.getBBox();
      curEl.classList.remove('up', 'in');
      curEl.classList.add('up');
      nxtEl.classList.add('on', 'in');
      useA = !useA;
    }, 2600);
  }

  var m = /[?&]frame=(\d+)/.exec(location.search);
  if (m){ setFrame(Math.min(Math.max(parseInt(m[1], 10) - 1, 0), N - 1)); }
  if (location.hash === '#grid'){
    document.body.classList.add('grid');
    viewBtn.textContent = '播放视图';
  }
  if (/[?&]autoplay=1/.test(location.search)) { start(); }
})();
</script>
