<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#eef8f1" />
  <title>医疗答题</title>
  <style>
    :root {
      --ink: #1d3d2c;
      --muted: #7d8b84;
      --paper: #f4faf6;
      --card: #ffffff;
      --line: #d7eadc;
      --jade: #2f9a5c;
      --jade-deep: #1f7a45;
      --jade-soft: #e5f6ec;
      --load-ms: 6.4s;
      --serif: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;
      --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      height: 100dvh;
      overflow: hidden;
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(80% 55% at 50% 0%, #dff5e7 0%, transparent 58%),
        #e7f3eb;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; color: inherit; }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    :focus-visible {
      outline: 2px solid var(--jade);
      outline-offset: 3px;
    }

    .stage {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 18px 16px;
      overflow: hidden;
    }

    .stage-note {
      margin: 0;
      color: #5f8a70;
      font-size: 12px;
      letter-spacing: 0.16em;
    }

    .replay {
      border: 1px solid rgba(47, 154, 92, 0.4);
      background: rgba(255, 255, 255, 0.72);
      color: var(--jade-deep);
      border-radius: 999px;
      padding: 8px 16px;
      letter-spacing: 0.08em;
      cursor: pointer;
    }

    .replay:hover { background: #ffffff; }

    .phone {
      position: relative;
      width: min(390px, 100%);
      flex: 1;
      min-height: 0;
      max-height: 844px;
      border-radius: 36px;
      overflow: hidden;
      background:
        radial-gradient(90% 42% at 50% 0%, #e3f6ea 0%, transparent 68%),
        linear-gradient(180deg, #f3faf6 0%, #f7fbf8 46%, #f4f8f0 100%);
      box-shadow:
        0 0 0 1px rgba(47, 154, 92, 0.14),
        0 24px 50px rgba(40, 90, 60, 0.14);
    }

    .app {
      height: 100%;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: calc(14px + env(safe-area-inset-top)) 16px 12px;
      background: transparent;
      border-bottom: 1px solid #cfe6d6;
    }

    .nav-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .nav-title strong {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--jade-deep);
    }

    .nav-title span {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.18em;
    }

    .capsule {
      display: flex;
      align-items: center;
      height: 30px;
      padding: 0 10px;
      border: 1px solid rgba(28, 44, 41, 0.16);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.7);
      flex: none;
    }

    .capsule b {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--ink);
      box-shadow: 6px 0 0 var(--ink), 12px 0 0 var(--ink);
      margin-right: 16px;
    }

    .capsule i {
      width: 1px;
      align-self: stretch;
      margin: 6px 8px;
      background: rgba(28, 44, 41, 0.18);
    }

    .capsule em {
      width: 12px;
      height: 12px;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      font-style: normal;
    }

    .panels {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 16px 16px 12px;
      scrollbar-width: none;
    }

    .panels::-webkit-scrollbar { display: none; }

    .panel[hidden] { display: none; }

    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 42px;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--line);
      color: #8d938f;
      font-size: 14px;
    }

    .search svg { flex: none; }

    .entries {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
    }

    .entries li {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    .glyph {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: var(--jade-soft);
      color: var(--jade);
    }

    .block {
      margin-top: 18px;
    }

    .block h2 {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.16em;
      color: var(--muted);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 16px;
    }

    .card p {
      margin: 0;
      line-height: 1.7;
      color: var(--ink);
    }

    .card small {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      line-height: 1.6;
    }

    .quiet p {
      margin: 0;
    }

    .rail {
      display: grid;
      gap: 0;
    }

    .rail div {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 12px;
      padding: 14px 0;
      border-top: 1px solid var(--line);
    }

    .rail div:first-child { border-top: 0; padding-top: 0; }

    .rail dt {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .rail dd {
      margin: 0;
      font-size: 15px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--jade);
      color: #ffffff;
      font-family: var(--serif);
      font-size: 22px;
    }

    .profile strong {
      display: block;
      font-size: 18px;
      letter-spacing: 0.08em;
    }

    .profile span {
      color: var(--muted);
      font-size: 13px;
    }

    .rows {
      display: grid;
    }

    .rows div {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 2px;
      border-top: 1px solid var(--line);
      font-size: 15px;
    }

    .rows div:first-child { border-top: 0; }

    .inline-replay {
      margin-top: 22px;
      border: 0;
      background: transparent;
      color: var(--jade);
      padding: 0;
      letter-spacing: 0.08em;
      cursor: pointer;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line);
      background: rgba(247, 251, 248, 0.94);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .tabs button {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 8px 0 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #8aa394;
      font-size: 11px;
      letter-spacing: 0.06em;
      cursor: pointer;
    }

    .tabs button[aria-current="page"] { color: var(--jade); }

    .splash {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(75% 42% at 50% 0%, #d9f3e3 0%, transparent 70%),
        radial-gradient(60% 36% at 88% 100%, #e8f6d4 0%, transparent 62%),
        linear-gradient(180deg, #eef8f1 0%, #f7fbf8 48%, #f3f7ee 100%);
      color: var(--jade-deep);
    }

    .splash-center {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 0 76px;
    }

    .ecg {
      width: calc(100% - 28px);
      height: 52px;
      display: block;
    }

    .ecg-path {
      fill: none;
      stroke: var(--jade);
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 520;
      stroke-dashoffset: 520;
      filter: drop-shadow(0 0 4px rgba(47, 154, 92, 0.35));
    }

    .seal {
      position: relative;
      width: 74px;
      height: 74px;
      margin-top: 6px;
    }

    .seal svg { width: 100%; height: 100%; display: block; }

    .seal-ring {
      fill: none;
      stroke: var(--jade);
      stroke-width: 1.35;
      stroke-dasharray: 190;
      stroke-dashoffset: 190;
    }

    .seal-char {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: var(--serif);
      font-size: 28px;
      letter-spacing: 0;
      opacity: 0;
    }

    .splash-sub {
      opacity: 0;
    }

    .eyebrow {
      margin: 14px 0 0;
      color: var(--jade);
      font-size: 12px;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
    }

    .splash-title {
      margin: 6px 0 0;
      display: flex;
      gap: 0.16em;
      font-family: var(--serif);
      font-size: 40px;
      font-weight: 600;
      letter-spacing: 0;
      text-indent: 0;
    }

    .splash-title span {
      display: block;
      opacity: 0;
      transform-origin: 50% 70%;
    }

    .splash-sub {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.28em;
      text-indent: 0.28em;
    }

    .load {
      position: absolute;
      left: 40px;
      right: 40px;
      bottom: 32px;
      display: grid;
      gap: 8px;
    }

    .load-track {
      height: 6px;
      border-radius: 999px;
      background: rgba(47, 154, 92, 0.16);
      overflow: hidden;
    }

    .load-fill {
      display: block;
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, #49c07e, var(--jade));
    }

    .load-label {
      margin: 0;
      text-align: center;
      color: var(--jade);
      font-size: 12px;
      letter-spacing: 0.16em;
    }

    .phone.play .ecg-path {
      animation: draw 2.4s cubic-bezier(0.45, 0, 0.2, 1) 0.35s forwards;
    }

    .phone.play .seal-ring {
      animation: draw 1.2s cubic-bezier(0.4, 0, 0.15, 1) 2.4s forwards;
    }

    .phone.play .seal-char {
      animation: squash 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 3.15s forwards;
    }

    .phone.play .splash-title span:nth-child(1) {
      animation: warp-a 0.82s cubic-bezier(0.18, 0.8, 0.2, 1) 3.55s forwards;
    }

    .phone.play .splash-title span:nth-child(2) {
      animation: warp-b 0.82s cubic-bezier(0.18, 0.8, 0.2, 1) 3.7s forwards;
    }

    .phone.play .splash-title span:nth-child(3) {
      animation: warp-c 0.82s cubic-bezier(0.18, 0.8, 0.2, 1) 3.85s forwards;
    }

    .phone.play .splash-title span:nth-child(4) {
      animation: warp-d 0.82s cubic-bezier(0.18, 0.8, 0.2, 1) 4s forwards;
    }

    .phone.play .splash-sub {
      animation: skew-in 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) 4.45s forwards;
    }

    .stickers { pointer-events: none; }

    .sticker {
      position: absolute;
      z-index: 1;
      opacity: 0;
      filter: drop-shadow(0 8px 12px rgba(47, 122, 72, 0.16));
    }

    .sticker svg { display: block; width: 100%; height: auto; }

    .sticker-card { top: 33%; left: 12px; width: 78px; }
    .sticker-ask { top: 27%; right: 14px; width: 62px; }
    .sticker-ok { top: 52%; right: 16px; width: 54px; }
    .sticker-pill { top: 58%; left: 18px; width: 68px; }

    .phone.play .sticker-card { animation: pop-left 0.8s cubic-bezier(0.2, 0.85, 0.2, 1) 0.45s forwards; }
    .phone.play .sticker-ask { animation: pop-right 0.8s cubic-bezier(0.2, 0.85, 0.2, 1) 0.7s forwards; }
    .phone.play .sticker-ok { animation: pop-right 0.75s cubic-bezier(0.2, 0.85, 0.2, 1) 1.05s forwards; }
    .phone.play .sticker-pill { animation: pop-left 0.75s cubic-bezier(0.2, 0.85, 0.2, 1) 1.25s forwards; }

    .phone.play .sticker-bob {
      animation: bob 3.2s ease-in-out 2s infinite;
    }

    .phone.play .load-fill {
      animation: load var(--load-ms) linear forwards;
    }

    .phone.play .splash {
      animation: curtain 0.8s cubic-bezier(0.76, 0, 0.18, 1) 6.55s forwards;
    }

    .phone.play .app {
      animation: rise 0.6s ease 6.85s both;
    }

    .phone.is-settled .splash {
      animation: none;
      transform: translateY(-101%);
      visibility: hidden;
      pointer-events: none;
    }

    .phone.is-settled .app { animation: none; opacity: 1; }

    @keyframes draw { to { stroke-dashoffset: 0; } }

    @keyframes fade { to { opacity: 1; } }

    @keyframes squash {
      0% { opacity: 0; transform: scaleX(1.7) scaleY(0.35) rotate(-10deg); }
      55% { opacity: 1; transform: scaleX(0.84) scaleY(1.22) rotate(4deg); }
      100% { opacity: 1; transform: none; }
    }

    @keyframes warp-a {
      0% { opacity: 0; transform: translateY(22px) scaleX(1.55) scaleY(0.45) skewX(-16deg) rotate(-8deg); }
      62% { opacity: 1; transform: translateY(-3px) scaleX(0.9) scaleY(1.14) skewX(6deg) rotate(2deg); }
      100% { opacity: 1; transform: none; }
    }

    @keyframes warp-b {
      0% { opacity: 0; transform: translateY(-16px) scaleX(0.45) scaleY(1.6) skewY(12deg) rotate(8deg); }
      62% { opacity: 1; transform: translateY(2px) scaleX(1.12) scaleY(0.88) skewY(-4deg) rotate(-2deg); }
      100% { opacity: 1; transform: none; }
    }

    @keyframes warp-c {
      0% { opacity: 0; transform: translateX(-12px) scale(0.4) rotate(-18deg) skewX(18deg); }
      60% { opacity: 1; transform: scale(1.12) rotate(5deg) skewX(-6deg); }
      100% { opacity: 1; transform: none; }
    }

    @keyframes warp-d {
      0% { opacity: 0; transform: translateY(14px) scaleX(1.8) scaleY(0.4) rotate(12deg); }
      64% { opacity: 1; transform: scaleX(0.88) scaleY(1.16) rotate(-3deg); }
      100% { opacity: 1; transform: none; }
    }

    @keyframes skew-in {
      from { opacity: 0; transform: skewX(-18deg) scaleX(1.25); letter-spacing: 0.55em; }
      to { opacity: 1; transform: none; letter-spacing: 0.28em; }
    }

    @keyframes pop-left {
      0% { opacity: 0; transform: translate(-16px, 12px) rotate(-24deg) scale(0.55); }
      100% { opacity: 1; transform: rotate(-11deg) scale(1); }
    }

    @keyframes pop-right {
      0% { opacity: 0; transform: translate(16px, 10px) rotate(22deg) scale(0.55); }
      100% { opacity: 1; transform: rotate(9deg) scale(1); }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes curtain {
      from { transform: translateY(0); }
      to { transform: translateY(-101%); }
    }

    @keyframes load { to { width: 100%; } }

    @media (max-width: 520px) {
      .stage { padding: 0; display: block; }
      .stage-note, .stage > .replay { display: none; }
      .phone {
        width: 100%;
        height: 100dvh;
        max-height: none;
        border-radius: 0;
        box-shadow: none;
      }
    }

    @media (max-height: 640px) and (min-width: 521px) {
      .stage { padding: 10px; gap: 0; }
      .stage-note, .stage > .replay { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash { display: none; }
      .phone.play .app,
      .phone.play .splash,
      .phone.play .ecg-path,
      .phone.play .seal-ring,
      .phone.play .seal-char,
      .phone.play .splash-title span,
      .phone.play .splash-sub,
      .phone.play .load-fill,
      .phone.play .sticker,
      .phone.play .sticker-bob {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <p class="stage-note">手机端框架 · 开场约 7 秒</p>
    <div class="phone" id="phone">
      <div class="app">
        <header class="nav">
          <div class="nav-title">
            <strong>医疗答题</strong>
          </div>
          <div class="capsule" aria-hidden="true">
            <b></b>
            <i></i>
            <em></em>
          </div>
        </header>
        <main class="panels">
          <section class="panel" data-panel="home">
            <div class="search">
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="7" cy="7" r="4.25" fill="none" stroke="currentColor" stroke-width="1.4" />
                <path d="M10.2 10.2 L13 13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
              </svg>
              <span>搜索科室、医生</span>
            </div>
            <ul class="entries">
              <li>
                <span class="glyph">
                  <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
                    <rect x="3" y="4.5" width="14" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.4" />
                    <path d="M3 8.5 H17 M7 3.5 V6 M13 3.5 V6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
                  </svg>
                </span>
                预约挂号
              </li>
              <li>
                <span class="glyph">
                  <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
                    <path d="M6 3.5 H12 L15 6.5 V16.5 H6 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
                    <path d="M8 10.5 H13 M8 13.5 H13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
                  </svg>
                </span>
                报告查询
              </li>
              <li>
                <span class="glyph">
                  <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
                    <rect x="2.5" y="5" width="15" height="10.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.4" />
                    <path d="M2.5 8.5 H17.5" fill="none" stroke="currentColor" stroke-width="1.4" />
                  </svg>
                </span>
                门诊缴费
              </li>
              <li>
                <span class="glyph">
                  <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
                    <path d="M10 17.5 C10 17.5 4.5 12.2 4.5 8.2 A5.5 5.5 0 0 1 15.5 8.2 C15.5 12.2 10 17.5 10 17.5 Z" fill="none" stroke="currentColor" stroke-width="1.4" />
                    <circle cx="10" cy="8.2" r="1.6" fill="none" stroke="currentColor" stroke-width="1.4" />
                  </svg>
                </span>
                院内导航
              </li>
            </ul>
            <section class="block">
              <h2>最近就诊</h2>
              <article class="card">
                <p>还没有待就诊记录</p>
                <small>预约成功后，就诊安排会列在这里。</small>
              </article>
            </section>
            <button class="inline-replay replay" type="button">再看一次开场</button>
          </section>

          <section class="panel" data-panel="visit" hidden>
            <section class="block" style="margin-top: 0">
              <h2>就诊安排</h2>
              <article class="card">
                <dl class="rail">
                  <div>
                    <dt>挂号</dt>
                    <dd>待接入</dd>
                  </div>
                  <div>
                    <dt>候诊</dt>
                    <dd>待接入</dd>
                  </div>
                  <div>
                    <dt>报告</dt>
                    <dd>待接入</dd>
                  </div>
                </dl>
              </article>
            </section>
          </section>

          <section class="panel" data-panel="inbox" hidden>
            <article class="card quiet">
              <p>暂无消息</p>
              <small>停诊、叫号和报告通知会显示在这里。</small>
            </article>
          </section>

          <section class="panel" data-panel="me" hidden>
            <div class="profile">
              <div class="avatar" aria-hidden="true">访</div>
              <div>
                <strong>未登录</strong>
                <span>就诊人信息会显示在这里</span>
              </div>
            </div>
            <div class="card">
              <div class="rows">
                <div>就诊人</div>
                <div>我的报告</div>
                <div>设置</div>
              </div>
            </div>
            <button class="inline-replay replay" type="button">再看一次开场</button>
          </section>
        </main>
        <nav class="tabs" aria-label="主导航">
          <button type="button" data-tab="home" aria-current="page">

  <script>
    const phone = document.getElementById("phone");
    const tabs = document.querySelectorAll("[data-tab]");
    const panels = document.querySelectorAll("[data-panel]");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const loadNum = document.querySelector(".load-num");
    const LOAD_MS = 6400;
    const EXIT_MS = 7500;
    let timer = 0;
    let raf = 0;

    function armTrace(selector) {
      document.querySelectorAll(selector).forEach((shape) => {
        const length = shape.getTotalLength();
        shape.style.strokeDasharray = String(length);
        shape.style.strokeDashoffset = String(length);
      });
    }

    function settle() {
      phone.classList.add("is-settled");
    }

    function play() {
      if (reduce) {
        settle();
        return;
      }
      window.clearTimeout(timer);
      window.cancelAnimationFrame(raf);
      phone.classList.remove("is-settled", "play");
      armTrace(".ecg-path");
      armTrace(".seal-ring");
      loadNum.textContent = "0";
      void phone.offsetWidth;
      phone.classList.add("play");
      const start = performance.now();
      const step = (now) => {
        const progress = Math.min(100, Math.round(((now - start) / LOAD_MS) * 100));
        loadNum.textContent = String(progress);
        if (progress < 100) raf = window.requestAnimationFrame(step);
      };
      raf = window.requestAnimationFrame(step);
      timer = window.setTimeout(settle, EXIT_MS);
    }

    document.querySelectorAll(".replay").forEach((button) => {
      button.addEventListener("click", play);
    });

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        const id = tab.dataset.tab;
        tabs.forEach((item) => {
          if (item === tab) item.setAttribute("aria-current", "page");
          else item.removeAttribute("aria-current");
        });
        panels.forEach((panel) => {
          panel.hidden = panel.dataset.panel !== id;
        });
      });
    });

    if (reduce) settle();
    else play();
  </script>
